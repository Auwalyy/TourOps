services:
  - type: web
    name: tourops-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=apps/api
    startCommand: npm run render-start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set this to your deployed web service's URL (see DEPLOYMENT.md)
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: 'TourOps <noreply@tourops.com>'
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: tourops-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      # Set this to your deployed API service's URL (see DEPLOYMENT.md)
      - key: NEXT_PUBLIC_API_URL
        sync: false
